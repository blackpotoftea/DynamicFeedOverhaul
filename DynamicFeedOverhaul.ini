; SkyPromptVampireFeed Configuration
; Place this file in Data/SKSE/Plugins/

[General]
; Enable or disable the entire mod
EnableMod = true
; Log verbosity: trace, debug, info, warn, error
LogLevel = info
; Enable for Werewolf form (EXPERIMENTAL: May be buggy and needs more work)
EnableWerewolf = true
; Enable for Vampire Lord form
EnableVampireLord = true
; Debug: skip vampire check, always allow feeding (for testing)
ForceVampire = false
; Only allow feeding if vampire hunger stage >= MinHungerStage
CheckHungerStage = true
; Minimum hunger stage required to feed (1-4, where 4 is most hungry)
MinHungerStage = 2
; Debug: force specific FeedType (0=auto, 11-14=standing, 21-24=sleeping, 31-34=sitting, 41-44=combat)
ForceFeedType = 0
; Debug: cycle through all available animations sequentially from loaded JSON files
; Ignores hunger/gender restrictions but respects general context
DebugAnimationCycle = false
; Timeout for animation events in seconds (default 15.0)
AnimationTimeout = 10.0
; Interval in seconds for periodic validity checks (default 1.0)
PeriodicCheckInterval = 1.0
; Delay in seconds before showing prompt when targeting a new NPC outside combat (default 0.2)
PromptDelayIdleSeconds = 0.2

[Input]
; Keyboard key code for feed action (DirectInput scan codes)
; Common keys: 0x12=E, 0x13=R, 0x14=T, 0x15=Y, 0x21=F, 0x22=G, 0x23=H
; Full list: https://wiki.nexusmods.com/index.php/DirectX_Scancodes_And_How_To_Use_Them
FeedKey = 0x22
; Gamepad button code for feed action
; 0x1000=A, 0x2000=B, 0x4000=X, 0x8000=Y, 0x10=LB, 0x20=RB
FeedGamepadKey = 0x1000
; Keyboard key code for secondary prompt - Embrace (Sacrosanct) (default 0x23 = H)
SecondaryKey = 0x23
; Gamepad key code for secondary prompt - Embrace (Sacrosanct) (default 0x2000 = B)
SecondaryGamepadKey = 0x2000

[PromptDisplay]
; Only show feed prompt when weapon/magic is drawn or player is in combat
RequireWeaponDrawn = false
; Show feed prompt when player is sneaking (enables stealth takedowns via vampire feed)
ShowWhenSneaking = true
; Only show feed prompt when player is facing the target
RequirePlayerFacing = true
; Maximum angle (degrees) from player heading to target (90 = 180 degree cone in front)
FacingAngleThreshold = 180.0
; Disable player facing requirement during combat (easier target selection in combat)
RelaxedCombatTargeting = true
; Maximum distance to target for feed prompt to show (units, 250 = ~5 meters)
MaxTargetDistance = 150.0

[NonCombat]
; Allow feeding on standing NPCs
AllowStanding = true
; Allow feeding on sleeping NPCs
AllowSleeping = true
; Allow feeding on NPCs sitting in chairs (no vanilla animation)
; Don't enable unless you have created behavioral patch and adjusted graph to have chair animations
AllowSittingChair = false
; Adjust actor positions when on stairs to fix animation issues
EnableHeightAdjust = true
; Minimum height difference to trigger adjustment (units)
MinHeightDiff = 0.0
; Maximum height difference for adjustment (~3-4 stair steps)
MaxHeightDiff = 150.0
; Staged composite standing feed: two single-actor clips played in sync per stage,
; sequenced Intro -> feeding Loop -> Exit -> Drained (clips loaded from the *_DFO.json packs)
UseCompositePairedAnimation = true
; Use player-only composite packs for bed/bedroll feeds: the player plays a side-of-bed clip while the sleeping victim stays in place (requires custom furniture animations)
UseCompositeFurnitureAnimation = true
; Staged composite sequence: Intro -> feeding Loop -> Exit (player stops) or Kill (drained dry).
; Intro and Exit are timer-driven by the two durations below (no clip annotation ends them).
; Seconds the Intro clip plays before blending into the feeding Loop
CompositeIntroDuration = 5.0
; Seconds the Exit clip plays before the player is freed and the Drained aftermath begins
CompositeExitDuration = 5.0
; Drained aftermath end: the victim's clip annotation VFD_DrainedEnd ends the stage
; exactly when the clip finishes. The [Min, Max] below is a RANDOM fallback CAP
; (rolled each feed) used only if the clip has no VFD_DrainedEnd event. Set Max high
; to let the event always end it; Min 0 allows the aftermath to be skipped.
CompositeDrainedDurationMin = 0.0
CompositeDrainedDurationMax = 5.5
; Target positioning offsets in player's local coordinate system
TargetOffsetX = 0.0
TargetOffsetY = 0.0
TargetOffsetZ = 0.0
; Enable hold-to-kill feature: Hold button for LethalHoldDuration to kill non-combat targets
EnableLethalFeed = true
; Seconds to hold button for lethal feed (default 5.0)
LethalHoldDuration = 5.0
; Don't show kill prompt for Essential or Protected actors
ExcludeEssentialFromLethal = true
; Rotate player and target to face each other before feed animation
EnableRotation = true
; Exclude targets above player level + MaxLevelDifference (non-combat only)
EnableLevelCheck = true
; Max levels target can be above player for non-combat feeding
MaxLevelDifference = 10

[Combat]
; Enable combat feeding
Enabled = true
; Allow combat feeding even when CheckHungerStage would block non-combat feeding
IgnoreHungerCheck = true
; Require target to be below health threshold for combat feeding
RequireLowHealth = true
; Health percentage threshold (0.0-1.0) for combat feeding
LowHealthThreshold = 0.25
; Allow feeding on staggered targets (bypasses health check)
AllowStaggered = true
; Stagger feeding requires target to be lower level than player (ignored if poise mod detected)
StaggerRequireLowerLevel = true
; Target must be (playerLevel - this) or lower. E.g. player 20, diff 10 = target max level 10
StaggerMaxLevelDifference = 10
; Vampire Lord only: feed on much-weaker enemies at any health (no need to lower their health first).
; Normal-form combat stays gated by health/stagger to avoid the prompt showing on every weak enemy.
VampireLordLowLevelFeed = true
; Target must be (playerLevel - this) or lower for the VL low-level feed. E.g. player 30, diff 10 = target level 20 or lower
VampireLordLowLevelFeedDifference = 10
; Stop feed if witnessed by nearby NPCs who detect the player
EnableWitnessDetection = true
; Maximum distance (units) to check for witnesses during feed (default 1500 = ~30 meters)
WitnessDetectionRadius = 1500.0
; How often to check for witnesses during active feed in seconds (default 0.5)
WitnessCheckInterval = 0.5
; Enable verbose witness detection debug logging (can be very spammy)
WitnessDebugLogging = false
; Delay in seconds before showing prompt in combat (default 0 for immediate response)
PromptDelayCombatSeconds = 0.0
; An awake victim who survives a feed fights back if brave enough; otherwise only the bounty applies
EnableWitnessCombatReaction = true
; Minimum victim Confidence to fight back when awake (0=Cowardly, 1=Cautious, 2=Average, 3=Brave, 4=Foolhardy)
AssaultConfidenceThreshold = 3
; Factor in relationship/faction: friends never attack or report, foes/enemies always attack, others decide by Confidence (off = Confidence only)
WitnessRelationshipAware = true
; Bounty added when a feed is witnessed in public, applied once per feed. 0 = use the hold's vanilla assault crime gold
WitnessAssaultBounty = 0

[Filtering]
; Exclude targets currently in a scene (dialogues, scripted events)
ExcludeInScene = true
; Exclude targets in OStim NG scenes (auto-detects OStim, gracefully disabled if not installed)
ExcludeOStimScenes = true
; Exclude targets in SexLab scenes (auto-detects SexLab, gracefully disabled if not installed)
ExcludeSexLabScenes = true
; Exclude dead actors from feeding
ExcludeDead = true
; Allow feeding on recently dead actors (overrides ExcludeDead for fresh corpses)
AllowRecentlyDead = true
; Maximum in-game hours since death to allow feeding (default 1.0 = 1 hour)
MaxDeadHours = 2.0
; Maximum times to feed on a single corpse (0=unlimited, resets on game reload)
MaxDeadFeeds = 1
; Only allow feeding if target has ANY of these keywords (comma-separated, empty=allow all)
IncludeKeywords = ActorTypeNPC
; Never allow feeding if target has ANY of these keywords (comma-separated)
; Excludes: automatons, undead, ghosts, atronachs
; Optional: ActorTypeVampire, ActorTypeDaedra
ExcludeKeywords = ActorTypeDwarven, ActorTypeDraugr, ActorTypeGhost, ActorTypeAtronach
; Never allow feeding on specific NPCs by base form ID (format: PluginName|0xFormID)
; Example: Serana from Dawnguard
ExcludeActorIDs = Dawnguard.esm|0x002B6C

[IconOverlay]
; Show vampire fang icon above target's head during feeding
EnableIconOverlay = true
; Icon position: 0=AboveHead, 1=RightOfHead
IconPosition = 0
; How long to display icon in seconds
IconDuration = 5.0
; Size of the icon in pixels
IconSize = 128.0
; Height offset above the target's head in game units (default 15.0)
IconHeightOffset = 10.0
; Path to the icon file
IconPath = Data\Interface\ImGuiIcons\Icons\vampireFangs_2.png

[HealthBarOverlay]
; Show the victim's health bar above their head during a feed (custom overlay, reliable regardless of TrueHUD/TDM)
Enable = true
; Health bar width in pixels
Width = 120.0
; Health bar height in pixels
Height = 10.0
; Size multiplier applied to the bar width and height (1.0 = default)
Scale = 1.0
; Height of the bar above the victim's head (game units)
HeightOffset = 25.0
; Screen-space horizontal offset in pixels (+ = right)
OffsetX = 0.0
; Screen-space vertical offset in pixels (+ = down)
OffsetY = 0.0
; Trailing "damage chip" layer: a lagging bar that holds for a beat after a drain, then slides
; down to catch up to the front bar (shows how much was just drained).
EnableTrailing = true
; Seconds the trailing layer holds before sliding down to catch up
TrailingDelay = 0.35
; Catch-up speed of the trailing layer (bar fractions per second)
TrailingSpeed = 1.0

[Animation]
; Enable random animation selection from available FeedType lists
EnableRandomSelection = true
; Hunger stage >= this uses hungry animations (1=sated, 2=peckish, 3=hungry, 4=starving)
HungryThreshold = 3
; Enable time slowdown effect when paired feed animation starts
EnableTimeSlowdown = false
; Time multiplier during feed (0.4 = 40% speed, 1.0 = normal speed)
TimeSlowdownMultiplier = 0.4
; Default vampire feed sound played during feeds (composite animation + integrations)
; Format: PluginName|0xFormID  (must be a Sound Descriptor / SNDR record)
; Leave empty to disable. Default: NPCHumanVampireFeed (vanilla vampire bite slurp)
FeedSoundForm = Skyrim.esm|0x0FF984
; Sound played at player when feed animation fails to start (after all retries)
; Format: PluginName|0xFormID  (must be a Sound Descriptor / SNDR record)
; Leave empty to disable. Default: WPNBlockBlade1HandVsOtherSD (sword-clash / parry clang)
FailureSoundForm = Skyrim.esm|0x3C73C

[HealthDrain]
; Drain the victim's HP during a feed. Two mechanisms share this section:
;  - VFD-event drain: fires on VFD_VampireFeedTrigger animation annotations (legacy feeds)
;  - Composite gulp drain: timer-driven, used by the composite feeding loop
; Master toggle for the VFD-event drain
Enable = true
; Target NPC only: floor drained HP at 1 so the drain itself can never kill (animation handles the kill)
FloorTargetAtOneHP = true
; Apply the drain chunk to the target NPC each VFD_VampireFeedTrigger
DrainOnNPC = true
; Lethal feeds (VFD): lower/upper bound of % of current HP drained per trigger
LethalChunkMinPercent = 20.0
LethalChunkMaxPercent = 50.0
; Multiplier applied to the roll for each successive trigger in same feed (1.0 = no escalation)
EscalationPerTrigger = 1.2
; Non-lethal feeds (VFD): fixed % of current HP per trigger
NonLethalChunkPercent = 10.0
; Safety cap so escalation can't one-shot to 1 HP
MaxChunkCapPercent = 95.0
; Composite gulp drain: the feeding loop removes HP in randomized chunks ("gulps") at randomized
; intervals (like sucking blood in mouthfuls) rather than a smooth bleed.
; Seconds between gulps (randomized between min and max)
GulpIntervalMin = 0.7
GulpIntervalMax = 1.5
; HP drained per gulp as a percent of the victim's max health (randomized between min and max)
GulpPercentMin = 7.0
GulpPercentMax = 16.0
; Victim HP fraction (0.0-1.0) at/below which the feeding loop drains the victim dry and kills them
GulpLethalThreshold = 0.05
; HP fraction (0.0-1.0) floor for essential/protected victims when ExcludeEssentialFromLethal is on.
; They drain down to this floor but are never killed (feeding ends when you stop).
GulpProtectedFloor = 0.15

[Integration]
; Enable Sacrosanct vampire overhaul integration (auto-detects mod)
EnableSacrosanct = true
; Enable Sacrilege vampire overhaul integration (auto-detects mod)
EnableSacrilege = true
; Enable Better Vampires integration (auto-detects mod)
EnableBetterVampires = true
; When poise mod (ChocolatePoise/loki_POISE) is detected, ignore level requirements for feeding
PoiseIgnoresLevelCheck = true
; Use C++ to mimic Sacrosanct ProcessFeed for lethal feeds (bypasses Papyrus)
DeepSacrosanctIntegration = true
; Use C++ to mimic Sacrilege ProcessFeed for lethal feeds (bypasses Papyrus)
DeepSacrilegeIntegration = true
; Use C++ integration for Sacrosanct during combat (bypasses AI-driven state issues)
EnableSacrosanctInCombat = true
; Use C++ integration for Sacrilege during combat (bypasses AI-driven state issues)
EnableSacrilegeInCombat = true

; Overhaul-provided secondary abilities, grouped by mod: one [Section] per overhaul, one key
; per ability/spell named <Ability>_Mode. Each gates that ability's prompt ONLY - the normal
; Feed prompt keeps its own rules (hunger, distance, facing, etc.).
[Sacrosanct]
; Embrace (Foster Childe perk): turn a live NPC into a vampire thrall.
; Targeting mode (higher = more permissive; each level includes the ones below):
;   0 = Off          - Embrace prompt never shown
;   1 = Restricted   - generic NPCs only (no Protected, no Essential, out of combat)
;   2 = Followers    - also Protected NPCs, i.e. followers/potential-followers  [default]
;   3 = Unrestricted - also Essential (plot-critical) NPCs, already-vampires, and in combat
Embrace_Mode = 2
